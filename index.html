<!DOCTYPE html>
<html lang="en">
    <audio autoplay loop controls style="display: block; margin: 20px auto; opacity: 0">
        <source src="nothing seen outside the closet.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
      <script>
        document.addEventListener('click', function() {
            var audio = document.querySelector('audio');
            if (audio) { audio.play(); }
        }, { once: true });
    </script>
<head>
    <meta charset="UTF-8">
    <title>seek.</title>
    
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        html {
            filter: contrast(160%) brightness(90%) url(#pixelate);
            background-color: #000000;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'VT323', monospace;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
        html::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 5px;
            z-index: 9999;
            pointer-events: none;
        }

        img, video {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .main-title {
            font-size: 100px; 
            text-align: center;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #444444, -2px -2px 0px #AAAAAA;
        }

        .hidden-message {
            color: #343434; 
            text-align: left; 
            font-size: 20px; 
            display: block;
            padding: 20px;
        }
        
    </style>
</head>
<body>

    <svg xmlns="http://w3.org" style="display: none;">
        <filter id="pixelate" x="0%" y="0%" width="100%" height="100%">
            <feGaussianBlur stdDeviation="1.5" result="blur" />
            <feComponentTransfer in="blur" result="brick">
                <feFuncR type="discrete" tableValues="0 0.2 0.4 0.6 0.8 1" />
                <feFuncG type="discrete" tableValues="0 0.2 0.4 0.6 0.8 1" />
                <feFuncB type="discrete" tableValues="0 0.2 0.4 0.6 0.8 1" />
            </feComponentTransfer>
        </filter>
    </svg>

    <div style="height: 20vh;"></div>

    <div>
        <p class="main-title">IS IT REALLY NEEDED?</p>
    </div>

    <div style="height: 300vh;"></div>

    <span class="hidden-message">the mall with no way. the creature with no face. all in there. all nowhere.</span>

</body>
</html>
