<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Analog Horror Archive</title>
    
    <!-- 1. FIXED: Added the Google Font link for true pixels -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        html {
            /* 2. FIXED: Active CRT pixelation shader filter linkage */
            filter: contrast(160%) brightness(90%) url(#pixelate);
            background-color: #000000;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'VT323', monospace;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px;
            box-sizing: border-box;
        }

        .quote-text {
            font-size: 42px; /* Adjusted slightly so long text fits on screens nicely */
            text-align: center;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #444444, -2px -2px 0px #aaaaaa;
            line-height: 1.4;
            max-width: 900px;
            word-wrap: break-word;
        }

        /* The blinking cursor at the end of the text string */
        .cursor {
            display: inline-block;
            width: 15px;
            background-color: #ffffff;
            margin-left: 5px;
            animation: blink-caret 0.75s step-end infinite;
        }

        @keyframes blink-caret {
            from, to { background-color: transparent }
            50% { background-color: #ffffff }
        }
    </style>
</head>
<body>

    <!-- 3. FIXED: Included the structural SVG shader block required for pixelation -->
    <svg xmlns="http://w3.org" style="display: none;">
        <filter id="pixelate" x="0%" y="0%" width="100%" height="100%">
            <feGaussianBlur stdDeviation="1.5" result="blur" />
            <feComponentTransfer in="blur" result="brick">
                <feFuncR type="discrete" tableValues="0 0.2 0.4 0.6 0.8 1" />
                <feFuncG type="discrete" tableValues="0 0.2 0.4 0.6 0.8 1" />
                <feFuncB type="discrete" tableValues="0 0.2 0.4 0.6 0.8 1" />
            </feComponentTransfer>
        </filter>
    </svg>

    <!-- Center layout workspace -->
    <div class="container">
        <!-- The JavaScript will type the message inside this p tag -->
        <p class="quote-text" id="typewriter-target"></p>
    </div>

    <!-- 4. FIXED: Added a robust paragraph typewriter script -->
    <script>
        const textToType = "Curious and naive, he went to the mall. What was there in time, what was there to see? Something that is dark, something that cannot be seen at first, consumed the poor soul. He lost his vessel. Lost to a prison, that torments since forever.";
        const targetElement = document.getElementById("typewriter-target");
        let index = 0;

        function typeWriter() {
            if (index < textToType.length) {
                // Strip the old cursor if it exists, append next letter, re-add flashing cursor block
                targetElement.innerHTML = textToType.substring(0, index + 1) + '<span class="cursor">&nbsp;</span>';
                index++;
                // 50ms = typing speed. Lower number is faster, higher number is slower.
                setTimeout(typeWriter, 50); 
            }
        }

        // Start typing automatically when the document loads
        window.onload = typeWriter;
    </script>

</body>
</html>
