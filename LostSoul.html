<html>
  <head>
    <style>
  .quote-text {
            font-size: 50px; 
            text-align: center;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #444444, -2px -2px 0px #AAAAAA;
        }

  .typewriter {
   display: inline-block;
    overflow: hidden;                
    border-right: 3px solid #ffffff;  
    white-space: nowrap;             
    letter-spacing: 2px;
    

    animation: 
        typing 3.5s steps(30, end) forwards,
        blink-caret 0.75s step-end infinite;
          }

@keyframes blink-caret {
    from, to { border-color: transparent }
    50% { border-color: #ffffff }
}
   </style>
</head>

<div>
<div style="height: 20vh;"></div>
    <p class="typewriter">
    <span class="quote-text">Curious and naive, he went to the mall. What was there in time, what was there to see? Something that is dark, something that cannot be seen at first, consumed the poor soul. He lost his vessel. Lost to a prison, that torments since forever.</span>
  </p>
  </div>
</html>
